<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>PKOS</title>
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <main>
    <h1>PKOS</h1>
    <p class="sub" id="sub">Starting your knowledge OS…</p>
    <ul id="steps"></ul>
    <div id="error" hidden>
      <p id="error-text"></p>
      <div class="buttons">
        <button id="retry">Try again</button>
        <button id="logs">Open logs</button>
        <button id="quit">Quit</button>
      </div>
    </div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
